<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>TestDaF Übung – Text &amp; Fragen</title>
<style>
  :root{
    --primary:#0e6e8c;
    --accent:#c8102e;
    --bg-box:#dde3e8;
    --border:#0e6e8c;
  }
  *{box-sizing:border-box; font-family: Arial, Helvetica, sans-serif;}
  body{margin:0; padding:20px; background:#f4f6f7; color:#222;}
  .header{background:var(--primary); color:#fff; padding:14px 20px; font-size:22px; font-weight:bold; border-radius:4px 4px 0 0;}
  .instructions{background:#eaf1f4; padding:16px 20px; font-size:15px; line-height:1.5;}
  .timer{display:inline-block; border:2px solid var(--primary); border-radius:50%; width:70px; height:70px; text-align:center; line-height:70px; font-weight:bold; color:var(--primary); margin-top:10px;}
  .toolbar{display:flex; justify-content:flex-end; gap:8px; padding:10px 20px 0 20px; background:#fff;}
  .toolbtn{width:38px; height:38px; border:1px solid var(--primary); background:#fff; color:var(--primary); border-radius:4px; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px;}
  .toolbtn.small{font-size:12px;}
  .toolbtn.big{font-size:16px;}
  .toolbtn.active{background:var(--primary); color:#fff;}
  .main{display:flex; gap:16px; padding:10px 20px 20px 20px; background:#fff;}
  .textpanel{flex:1; max-height:600px; overflow-y:auto; padding-right:10px; border-right:1px solid #ccc; font: size 15px; line-height:1.6;}
  .textpanel h3{color:var(--primary);}
  .textpanel p{margin-bottom:16px;}
  .textpanel .pnum{font-weight:bold; color:var(--primary);}
  .textpanel mark.hl{background:#fdea63; cursor:pointer; border-radius:2px;}
  .textpanel.marking{cursor:text;}
  .qpanel{flex:1.2;}
  .qrow{background:var(--bg-box); border:1px solid #aab; border-radius:4px; margin-bottom:10px; overflow:hidden;}
  .qhead{padding:10px 14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; font-size: 15px;}
  .qhead b{color:var(--primary); margin-right:6px;}
  .qhead.answered{background:#eef3f5;}
  .qbody{display:none; padding:8px 14px 14px 14px; background:#fff;}
  .qbody.open{display:block;}
  .option{display:block; width:100%; text-align:left; padding:8px 10px; margin:4px 0; border:1px solid #bbb; border-radius:4px; background:#fdfdfd; cursor:pointer; user-select:text; font-size:15px;}
  .option.selected{border-color:var(--primary); background:#dceaf0;}
  .option.correct{border-color:green; background:#e3f7e3;}
  .option.wrong{border-color:var(--accent); background:#fbe4e7;}
  .option,
.option * {
    font-size: 15px !important;
}

.option{
    display:block;
    width:100%;
    text-align:left;
    padding:8px 10px;
    margin:4px 0;
    border:1px solid #bbb;
    border-radius:4px;
    background:#fdfdfd;
    cursor:pointer;
    user-select:text;
    font-size:15px;
}
  .footer{display:flex; justify-content:flex-end; gap:10px; padding:16px 20px;}
  button{background:var(--accent); color:#fff;; border:none; padding:10px 20px; border-radius:4px; font-size:15px; cursor:pointer;}
  button.secondary{background:#888;}
  #result{padding:0 20px 20px; font-weight:bold;}
  </style>
</head>
<body>

<div class="header">LESEN – Aufgabentyp 3: Text &amp; Fragen</div>

<div class="instructions">
  Lesen Sie den Text.<br>
  <strong>Beantworten Sie die Fragen 1–7.</strong><br>
  Klicken Sie die Fragen an und entscheiden Sie, welche Lösung passt.<br>
  Für jede Frage gibt es genau eine richtige Lösung.
  <div class="timer" id="timer">15:10</div>
</div>

<div class="toolbar">
  <button class="toolbtn small" onclick="changeFontSize(-1)" title="Verkleinern">A-</button>
  <button class="toolbtn big" onclick="changeFontSize(1)" title="Vergrößern">A+</button>
  <button class="toolbtn" id="markBtn" onclick="toggleMarking()" title="Markieren">✎</button>
</div>

<div class="main">
  <div class="textpanel" id="textpanel"></div>
  <div class="qpanel" id="qpanel"></div>
</div>

<div id="result"></div>

<div class="footer">

  <button class="action secondary" onclick="resetExercise()">
    Zurücksetzen
  </button>

  <button class="action" onclick="checkAnswers()">
    Prüfen
  </button>

  <button class="action" onclick="saveAT3AndGoToNext()">Weiter</button>
</button>

</div>

<script>
/* ============================================================
   HIER ANPASSEN: Neue Übung = Titel, Absätze und Fragen ersetzen.
   correct = Index (0=a, 1=b, 2=c, 3=d)
   ============================================================ */
const textTitle = "Die Illusion der ständigen Erreichbarkeit";

const paragraphs = [

"Noch vor wenigen Jahrzehnten war es selbstverständlich, dass Menschen außerhalb ihrer Arbeitszeit nicht erreichbar waren. Ein Anruf musste warten, eine Nachricht konnte erst am nächsten Tag beantwortet werden. Mit der Verbreitung von Smartphones hat sich diese Grenze weitgehend aufgelöst. E-Mails, Messenger und Benachrichtigungen ermöglichen es, nahezu jederzeit miteinander in Kontakt zu bleiben. Was ursprünglich als Erleichterung gedacht war, kann jedoch dazu führen, dass Menschen das Gefühl entwickeln, ständig reagieren zu müssen.",

"Dabei ist nicht allein die tatsächliche Zahl der Nachrichten entscheidend. Bereits die Erwartung, jederzeit erreichbar sein zu müssen, kann die Aufmerksamkeit beeinflussen. Wer während einer Aufgabe regelmäßig damit rechnet, dass eine Nachricht eintreffen könnte, richtet einen Teil seiner Aufmerksamkeit auf eine mögliche Unterbrechung. Selbst wenn das Smartphone am Ende gar nicht klingelt, kann dadurch die Konzentration beeinträchtigt werden. Die ständige Erreichbarkeit ist somit nicht nur eine Frage der Kommunikation, sondern auch eine Frage der Aufmerksamkeit.",

"Besonders deutlich wird dieses Problem im Berufsleben. In manchen Unternehmen gilt es inzwischen als selbstverständlich, dass Beschäftigte auch abends oder am Wochenende auf berufliche Nachrichten reagieren. Technisch wäre es zwar möglich, die Kommunikation außerhalb der Arbeitszeit vollständig zu unterbrechen. In der Praxis verzichten viele Beschäftigte jedoch darauf, weil sie befürchten, als unzuverlässig oder wenig engagiert wahrgenommen zu werden. Die Grenze zwischen freiwilliger Erreichbarkeit und indirektem beruflichem Druck kann dadurch schwer erkennbar werden.",

"Eine naheliegende Reaktion besteht darin, möglichst viele Benachrichtigungen auszuschalten. Das kann tatsächlich helfen, die Zahl unmittelbarer Unterbrechungen zu reduzieren. Es löst das Problem jedoch nicht in jedem Fall. Wer weiterhin regelmäßig selbst überprüft, ob neue Nachrichten eingegangen sind, bleibt gedanklich an die Möglichkeit einer Kommunikation gebunden. Entscheidend ist daher nicht nur, wie viele Benachrichtigungen ein Gerät sendet, sondern auch, welche Gewohnheiten der Nutzer im Umgang damit entwickelt.",

"Gleichzeitig wäre es falsch, digitale Erreichbarkeit grundsätzlich als Belastung darzustellen. Für Menschen, die räumlich voneinander getrennt leben, können schnelle Nachrichten soziale Nähe ermöglichen. Auch in beruflichen Situationen kann eine kurzfristige Kommunikation sinnvoll sein, wenn Entscheidungen tatsächlich nicht bis zum nächsten Arbeitstag warten können. Das Problem entsteht daher weniger durch die technische Möglichkeit selbst als durch die Erwartung, dass diese Möglichkeit jederzeit genutzt werden sollte.",

"Die entscheidende Frage lautet deshalb nicht, ob Menschen erreichbar sein sollten, sondern unter welchen Bedingungen Erreichbarkeit sinnvoll ist. Dazu gehört, zwischen dringenden und nicht dringenden Nachrichten unterscheiden zu können und bewusst Zeiten festzulegen, in denen keine Reaktion erwartet wird. Eine solche Begrenzung bedeutet nicht zwangsläufig einen Verzicht auf digitale Kommunikation. Vielmehr kann sie dazu beitragen, die Vorteile ständiger Vernetzung zu nutzen, ohne dass Erreichbarkeit automatisch zur dauerhaften Verpflichtung wird.",

];

const questions = [

  { stem:"Was wird im ersten Absatz über die Entwicklung der Kommunikation gesagt?",
    options:[
      "Die Menschen kommunizieren heute weniger miteinander, weil Smartphones persönliche Gespräche ersetzen.",
      "Durch digitale Geräte ist eine frühere zeitliche Grenze der Erreichbarkeit weitgehend verschwunden.",
      "Nachrichten können heute schneller beantwortet werden, wodurch berufliche Kommunikation effizienter geworden ist.",
      "Die meisten Menschen empfinden die Möglichkeit, jederzeit erreichbar zu sein, als eine deutliche Erleichterung."
    ],
    correct:1 },

  { stem:"Warum kann laut Absatz 2 bereits die Erwartung einer Nachricht die Konzentration beeinträchtigen?",
    options:[
      "Weil eingehende Nachrichten normalerweise eine sofortige Reaktion erfordern.",
      "Weil Menschen bei der Arbeit häufig ihre Nachrichten lesen, anstatt ihre eigentliche Aufgabe zu erledigen.",
      "Weil ein Teil der Aufmerksamkeit auf die Möglichkeit einer Unterbrechung gerichtet bleibt.",
      "Weil Smartphones auch dann akustische Signale senden können, wenn keine Nachricht eingegangen ist."
    ],
    correct:2 },

  { stem:"Was macht die Situation im Berufsleben problematisch?",
    options:[
      "Die fehlende technische Kontrolle.",
      "Der berufliche Druck zur Erreichbarkeit.",
      "Die große Zahl beruflicher Nachrichten.",
      "Die fehlende Trennung von Arbeit und Freizeit."
    ],
    correct:1 },

  { stem:"Welche Aussage entspricht der Argumentation in Absatz 4?",
    options:[
      "Das Ausschalten von Benachrichtigungen ist wirkungslos, solange das Smartphone eingeschaltet bleibt.",
      "Die Häufigkeit der Nachrichten ist weniger relevant als die technische Ausstattung des Smartphones.",
      "Eine Verringerung der Benachrichtigungen kann helfen, reicht aber nicht unbedingt aus, wenn das eigene Nutzungsverhalten unverändert bleibt.",
      "Wer sein Smartphone regelmäßig selbst kontrolliert, wird weniger häufig durch Nachrichten unterbrochen."
    ],
    correct:2 },

  { stem:"Welche Einschränkung nennt der Autor?",
    options:[
      "Sie sollte grundsätzlich vermieden werden.",
      "Sie ist besonders für Familien belastend.",
      "Sie bringt vor allem im Beruf Nachteile.",
      "Sie kann problematisch sein, hat aber auch Vorteile."
    ],
    correct:3 },

  { stem:"Worin liegt laut Text das eigentliche Problem?",
    options:[
      "In der digitalen Kommunikation.",
      "In zu vielen Informationen.",
      "In der ständigen Reaktionspflicht.",
      "In fehlenden technischen Möglichkeiten."
    ],
    correct:2 },

  { stem:"Was ist die Hauptaussage des Textes?",
    options:[
      "Smartphones sollten häufiger ausgeschaltet werden.",
      "Digitale Kommunikation hat mehr Vorteile als Nachteile.",
      "Ständige Erreichbarkeit kann zur Reaktionspflicht werden.",
      "Weniger Benachrichtigungen verbessern die Konzentration."
    ],
    correct:2 }

];
/* ============================================================ */

let userAnswers = new Array(questions.length).fill(null);
let timeLeft = 910;
let timerInterval;
let fontSize = 15;
let markingOn = false;
const letters = ['a','b','c','d'];

function changeFontSize(delta){
  fontSize = Math.min(22, Math.max(11, fontSize + delta));

  document.getElementById('textpanel').style.fontSize = fontSize + 'px';
}

function toggleMarking(){
  markingOn = !markingOn;
  const btn = document.getElementById('markBtn');
  const tp = document.getElementById('textpanel');
  btn.classList.toggle('active', markingOn);
  tp.classList.toggle('marking', markingOn);
}

function handleTextpanelMouseUp(){
  if(!markingOn) return;
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed || sel.rangeCount === 0) return;
  const range = sel.getRangeAt(0);
  const tp = document.getElementById('textpanel');
  const allowed =
  document.getElementById('textpanel').contains(range.commonAncestorContainer) ||
  document.getElementById('qpanel').contains(range.commonAncestorContainer);

if(!allowed) return;
  if(range.toString().trim() === '') { sel.removeAllRanges(); return; }
  try{
    const mark = document.createElement('mark');
    mark.className = 'hl';
    range.surroundContents(mark);
  }catch(e){
    // selection crosses element boundaries; skip silently
  }
  sel.removeAllRanges();
}


function handleTextpanelClick(e){
  const mark = e.target.closest('mark.hl');
  if(mark){
    const parent = mark.parentNode;
    while(mark.firstChild) parent.insertBefore(mark.firstChild, mark);
    parent.removeChild(mark);
    parent.normalize();
  }
}

function buildExercise(){
  const tp = document.getElementById('textpanel');
  tp.innerHTML = `<h3>${textTitle}</h3>` +
  paragraphs.map((p,i)=>
    `<p class="paragraph-${i}">
      <span class="pnum">(${i+1})</span> ${p}
    </p>`
  ).join('');
  fontSize = 15;
  tp.style.fontSize = fontSize + 'px';
  markingOn = false;
  document.getElementById('markBtn').classList.remove('active');
  tp.classList.remove('marking');
  tp.onmouseup = handleTextpanelMouseUp;
  document.getElementById('qpanel').onmouseup = handleTextpanelMouseUp;
  tp.onclick = handleTextpanelClick;
  
  const qp = document.getElementById('qpanel');
  qp.innerHTML = '';
  userAnswers = new Array(questions.length).fill(null);

  questions.forEach((q, qi)=>{
    const row = document.createElement('div');
    row.className = 'qrow';

    const head = document.createElement('div');
    head.className = 'qhead';
    head.innerHTML = `<span><b>Frage ${qi+1}:</b> ${q.stem}</span><span>▾</span>`;
    head.onclick = ()=> toggleBody(qi);

    const body = document.createElement('div');
    body.className = 'qbody';
    body.id = 'qbody-'+qi;

    q.options.forEach((opt, oi)=>{
  const b = document.createElement('div');

  b.className = 'option';

  b.innerHTML =
    `<span class="option-letter">${letters[oi]})</span> ${opt}`;

  b.onclick = ()=> selectOption(qi, oi);

  body.appendChild(b);
});

    row.appendChild(head);
    row.appendChild(body);
    qp.appendChild(row);
  });

  document.getElementById('result').textContent = '';
  startTimer();
}

function toggleBody(qi){

  // Alle anderen Fragen schließen
  document.querySelectorAll('.qbody').forEach((body, i) => {
    if(i !== qi){
      body.classList.remove('open');
    }
  });

  // Nur die angeklickte Frage öffnen
  const body = document.getElementById('qbody-' + qi);
  body.classList.toggle('open');

  // Zum passenden Absatz springen
  const paragraph = document.querySelector(
    '#textpanel .paragraph-' + qi
  );

  if(paragraph){
    paragraph.scrollIntoView({
      behavior: 'smooth',
      block: 'center'
    });

    // Absatz hervorheben
    document.querySelectorAll('#textpanel p').forEach(p => {
      p.classList.remove('focus-paragraph');
    });

    paragraph.classList.add('focus-paragraph');
  }
}

function selectOption(qi, oi){
  userAnswers[qi] = oi;
  const body = document.getElementById('qbody-'+qi);
  [...body.children].forEach((btn, i)=>{
    btn.classList.toggle('selected', i===oi);
  });
  const heads = document.querySelectorAll('.qhead');
  heads[qi].classList.add('answered');
}

function saveAT3AndGoToNext(){
  let score = 0;

  questions.forEach((q, qi)=>{
    if(userAnswers[qi] === q.correct){
      score++;
    }
  });

  localStorage.setItem("Lesen_AT3.3", score);

  window.location.href = "Lesen_AT4.3.html";
}

function checkAnswers(){
  clearInterval(timerInterval);
  let score = 0;
  questions.forEach((q, qi)=>{
    const body = document.getElementById('qbody-'+qi);
    [...body.children].forEach((btn, oi)=>{
      btn.classList.remove('selected');
      if(oi === q.correct) btn.classList.add('correct');
      else if(oi === userAnswers[qi]) btn.classList.add('wrong');
    });
    body.classList.add('open');
    if(userAnswers[qi] === q.correct) score++;
  });
  const resultEl = document.getElementById('result');

  resultEl.style.color = score === questions.length ? 'green' : 'var(--accent)';
  resultEl.textContent = `Ergebnis: ${score} von ${questions.length} richtig.`;
}

function resetExercise(){
  clearInterval(timerInterval);
  timeLeft = 910;
  buildExercise();
}

function startTimer(){
  clearInterval(timerInterval);
  timeLeft = 910;
  updateTimerDisplay();
  timerInterval = setInterval(()=>{
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft<=0){
      clearInterval(timerInterval);
      checkAnswers();
    }
  },1000);
}

function updateTimerDisplay(){
  const m = String(Math.floor(timeLeft/60)).padStart(2,'0');
  const s = String(timeLeft%60).padStart(2,'0');
  document.getElementById('timer').textContent = `${m}:${s}`;
}

buildExercise();
</script>

</body>
</html>
