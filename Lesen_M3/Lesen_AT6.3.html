<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>TestDaF Übung – Aussagen einordnen</title>
<style>
  :root{
    --primary:#0e6e8c;
    --accent:#c8102e;
    --bg-box:#dde3e8;
  }
  *{box-sizing:border-box; font-family: Arial, Helvetica, sans-serif;}
  body{margin:0; padding:20px; background:#f4f6f7; color:#222;}
  .header{background:var(--primary); color:#fff; padding:14px 20px; font-size:22px; font-weight:bold; border-radius:4px 4px 0 0;}
  .instructions{background:#eaf1f4; padding:16px 20px; font-size:15px; line-height:1.5;}
  .timer{display:inline-block; border:2px solid var(--primary); border-radius:50%; width:70px; height:70px; text-align:center; line-height:70px; font-weight:bold; color:var(--primary); margin-top:10px;}
  .toolbar{display:flex; justify-content:flex-end; gap:8px; padding:10px 20px 0 20px; background:#fff;}
  .toolbtn{width:38px; height:38px; border:1px solid var(--primary); background:#fff; color:var(--primary); border-radius:4px; font-weight:bold; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:15px;}
  .toolbtn.small{font-size:12px;}
  .toolbtn.big{font-size:18px;}
  .toolbtn.active{background:var(--primary); color:#fff;}
  .main{display:flex; gap:20px; padding:10px 20px 20px 20px; background:#fff;}
  .textpanel{flex:1.2; max-height:640px; overflow-y:auto; padding-right:10px; border-right:1px solid #ccc; font-size:15px; line-height:1.6;}
  .textpanel h3{color:var(--primary); margin-top: 0;}
  .textpanel p{margin-bottom:14px;}
  .textpanel mark.hl{background:#fdea63; cursor:pointer; border-radius:2px;}
  .rightpanel{flex:1.3;}
  .cardgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  .card{background:#e2e8ec; border:1px solid #9ab; border-radius:4px; padding:10px 12px; font-size:15px; cursor:grab; min-height:20px; display:flex; align-items:center;}
  .card.dragging{opacity:0.4;}
  .tablebox{border:1px solid #ccc; border-radius:4px; overflow:hidden;}
  .tablebox .tbtitle{background:#fff; padding:8px 12px; font-weight:bold; font-size:15px; border-bottom:1px solid #ccc;}
  .tableheader{display:grid; grid-template-columns:1fr 1fr; background:#8f9aa3; color:#fff; font-weight:bold; font-size:14px;}
  .tableheader div{padding:8px 12px;}
  .tablerow{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:8px 10px; background:#f7f9fa;}
  .slot{min-height:44px; border:2px dashed var(--primary); border-radius:4px; background:#eef3f5; display:flex; align-items:center; padding:4px 8px;}
  .slot.filled{border-style:solid;}
  .slot.correct{border-color:green; background:#e3f7e3;}
  .slot.wrong{border-color:var(--accent); background:#fbe4e7;}
  .footer{display:flex; justify-content:flex-end; gap:10px; padding:16px 20px;}
  button.action{background:var(--accent); color:#fff; border:none; padding:10px 20px; border-radius:4px; font-size:15px; cursor:pointer;}
  button.action.secondary{background:#888;}
  #result{padding:0 20px 20px; font-weight:bold;}
</style>
</head>
<body>

<div class="header">LESEN – Aufgabentyp 6: Aussagen einordnen</div>

<div class="instructions">
  Lesen Sie den Text.<br>
  <strong>Entscheiden Sie, welche Aussagen stimmen.</strong> Ziehen Sie die richtigen Aussagen an die passende Stelle in der Tabelle.<br>
  Es müssen <span id="neededCountText">vier</span> Aussagen zugeordnet werden.
  <div class="timer" id="timer">07:10</div>
</div>

<div class="toolbar">
  <button class="toolbtn small" onclick="changeFontSize(-1)" title="Verkleinern">A-</button>
  <button class="toolbtn big" onclick="changeFontSize(1)" title="Vergrößern">A+</button>
  <button class="toolbtn" id="markBtn" onclick="toggleMarking()" title="Markieren">✎</button>
</div>

<div class="main">
  <div class="textpanel" id="textpanel"></div>
  <div class="rightpanel">
    <div class="cardgrid" id="cardgrid"></div>
    <div class="tablebox">
      <div class="tbtitle" id="tableTitle">Zuordnung</div>
      <div class="tableheader" id="tableHeader"></div>
      <div id="tableRows"></div>
    </div>
  </div>
</div>

<div class="footer">

  <button class="action secondary" onclick="resetExercise()">
    Zurücksetzen
  </button>

  <button class="action" onclick="checkAnswers()">
    Prüfen
  </button>

  <button class="action" onclick="saveAT6AndGoToNext()">Weiter</button>

</div>
<div id="result"></div>

<script>
/* ============================================================
   HIER ANPASSEN: Titel, Text, Tabellentitel + Spaltennamen,
   die 8 Aussagen (Buchstaben a-h) und die Lösung: zu welcher
   Spalte (0 oder 1, entsprechend "columns") jede Aussage gehört.
   Aussagen ohne Eintrag in "solution" sind Distraktoren.
   ============================================================ */
const textTitle = "Wenn Wissen verloren geht";

const tableTitle = "Wenn Wissen verloren geht";

const columns = ["Probleme", "Lösungen"];

const slotsPerColumn = 2;

const paragraphs = [

"Mit dem Verschwinden bestimmter handwerklicher Berufe geht nicht nur eine berufliche Tätigkeit verloren. In vielen Regionen verschwinden gleichzeitig Kenntnisse, die über Generationen weitergegeben wurden. Dazu gehören beispielsweise besondere Techniken der Holzverarbeitung, der Herstellung von Musikinstrumenten oder der Verarbeitung regionaler Materialien. Solches Wissen ist häufig an praktische Erfahrung gebunden und lässt sich nicht vollständig aus schriftlichen Anleitungen übernehmen.",

"Die Weitergabe dieses Wissens wird jedoch schwieriger, wenn immer weniger junge Menschen entsprechende Berufe erlernen. Ein Grund dafür liegt in den veränderten Arbeitsbedingungen. Tätigkeiten, die lange Ausbildungszeiten erfordern und körperlich anstrengend sind, erscheinen vielen Jugendlichen weniger attraktiv als andere Berufsmöglichkeiten. Hinzu kommt, dass traditionelle Produkte mit industriell hergestellten Waren konkurrieren müssen, die häufig schneller und günstiger produziert werden können.",

"Einige Fachleute schlagen deshalb vor, die Ausbildung in traditionellen Berufen stärker mit modernen Bildungsangeboten zu verbinden. Digitale Lernplattformen könnten beispielsweise dazu dienen, Arbeitsschritte zu dokumentieren und Lernenden unabhängig von ihrem Wohnort Zugang zu erfahrenen Fachleuten zu ermöglichen. Dabei soll die digitale Vermittlung die praktische Ausbildung nicht ersetzen, sondern ergänzen. Denn bestimmte Fertigkeiten entwickeln sich erst durch wiederholtes eigenes Arbeiten.",

"Auch Museen und kulturelle Einrichtungen versuchen, gefährdetes Wissen langfristig zugänglich zu machen. Sie dokumentieren Werkzeuge, Arbeitsprozesse und persönliche Erfahrungen von Handwerkern. Eine solche Sammlung kann später als Grundlage für Forschung und Ausbildung dienen. Allerdings besteht die Gefahr, dass ein Beruf dadurch nur noch als Teil der Vergangenheit dargestellt wird, obwohl seine Techniken auch für gegenwärtige Anwendungen interessant sein könnten.",

"Eine weitere Möglichkeit besteht darin, traditionelle Kenntnisse mit neuen wirtschaftlichen Anforderungen zu verbinden. Handwerker können beispielsweise historische Techniken für moderne Produkte einsetzen oder mit Designern zusammenarbeiten. Dadurch entsteht möglicherweise ein Markt für Erzeugnisse, die traditionelle Verfahren mit zeitgemäßen Formen verbinden. Allerdings lässt sich nicht jede traditionelle Technik auf diese Weise wirtschaftlich nutzen.",

"Letztlich hängt der Erhalt solchen Wissens nicht allein davon ab, ob einzelne Techniken dokumentiert werden. Entscheidend ist auch, ob Menschen weiterhin die Möglichkeit und den Anreiz haben, sie praktisch anzuwenden. Eine digitale Sammlung kann Informationen bewahren, aber sie kann nicht automatisch dafür sorgen, dass daraus lebendiges Können entsteht. Nachhaltig erhalten bleibt Wissen daher vor allem dann, wenn es weitergegeben, angewendet und unter veränderten Bedingungen weiterentwickelt wird."

];

const statements = [

  { letter:"a", text:"Schriftliche Anleitungen enthalten ausreichend Informationen für jede praktische Tätigkeit." },

  { letter:"b", text:"Museen ersetzen die praktische Ausbildung durch digitale Angebote." },

  { letter:"c", text:"Digitale Angebote können den Zugang zu erfahrenen Fachleuten erleichtern." },

  { letter:"d", text:"Alle traditionellen Techniken lassen sich erfolgreich vermarkten." },

  { letter:"e", text:"Traditionelle Berufe verlieren für viele junge Menschen an Attraktivität." },

  { letter:"f", text:"Industrielle Produkte werden grundsätzlich als qualitativ minderwertig betrachtet." },

  { letter:"g", text:"Alte Verfahren können mit aktuellen Produktideen verbunden werden." },

  { letter:"h", text:"Bestimmte Kenntnisse lassen sich nicht vollständig schriftlich vermitteln." }

];

// Buchstabe -> Spalten-Index
// 0 = Probleme
// 1 = Lösungen
// Nicht aufgeführte Buchstaben sind Distraktoren.

const solution = {

  h: 0, // Bestimmte Kenntnisse lassen sich nicht vollständig schriftlich vermitteln.
  e: 0, // Traditionelle Berufe verlieren für viele junge Menschen an Attraktivität.

  c: 1, // Digitale Angebote können den Zugang zu erfahrenen Fachleuten erleichtern.
  g: 1  // Alte Verfahren können mit aktuellen Produktideen verbunden werden.

};
/* ============================================================ */

let slotContents = {}; // slotId -> statement letter
let timeLeft = 430;
let timerInterval;
let fontSize = 15;
let markingOn = false;

function buildExercise(){
  const tp = document.getElementById('textpanel');
  tp.innerHTML = `<h3>${textTitle}</h3>` + paragraphs.map(p=>`<p>${p}</p>`).join('');
  tp.onmouseup = handleTextpanelMouseUp;
  fontSize = 15;
  tp.style.fontSize = fontSize + 'px';
  markingOn = false;
  document.getElementById('markBtn').classList.remove('active');

  document.getElementById('tableTitle').textContent = tableTitle;
  const header = document.getElementById('tableHeader');
  header.innerHTML = columns.map(c=>`<div>${c}</div>`).join('');

  const rowsEl = document.getElementById('tableRows');
  rowsEl.innerHTML = '';
  slotContents = {};
  for(let r=0; r<slotsPerColumn; r++){
    const row = document.createElement('div');
    row.className = 'tablerow';
    columns.forEach((c, ci)=>{
      const slot = document.createElement('div');
      slot.className = 'slot';
      const slotId = 'target-'+ci+'-'+r;
      slot.dataset.slot = slotId;
      slot.ondragover = e=>e.preventDefault();
      slot.ondrop = e=>onDrop(e, slotId);
      row.appendChild(slot);
      slotContents[slotId] = undefined;
    });
    rowsEl.appendChild(row);
  }

  const grid = document.getElementById('cardgrid');
  grid.innerHTML = '';
  statements.forEach(s=>{
    const home = document.createElement('div');
    home.className = 'slot';
    home.style.border = '2px dashed #bbb';
    home.style.background = '#fafafa';
    const slotId = 'home-'+s.letter;
    home.dataset.slot = slotId;
    home.ondragover = e=>e.preventDefault();
    home.ondrop = e=>onDrop(e, slotId);
    grid.appendChild(home);
    slotContents[slotId] = s.letter;
  });
  statements.forEach(s=> placeCardInSlot(s.letter, 'home-'+s.letter));

  document.getElementById('result').textContent = '';
  startTimer();
}

function makeCard(letter){
  const s = statements.find(x=>x.letter===letter);
  const card = document.createElement('div');
  card.className = 'card';
  card.draggable = true;
  card.dataset.letter = letter;
  card.textContent = s.text;
  card.addEventListener('dragstart', e=>{
    card.classList.add('dragging');
    e.dataTransfer.setData('text/plain', letter);
  });
  card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
  return card;
}

function findSlotOf(letter){
  for(const key in slotContents){
    if(slotContents[key] === letter) return key;
  }
  return null;
}

function placeCardInSlot(letter, slotId){
  const slotEl = document.querySelector(`[data-slot="${slotId}"]`);
  if(!slotEl) return;
  slotEl.innerHTML = '';
  slotEl.appendChild(makeCard(letter));
  slotEl.classList.add('filled');
}

function clearSlot(slotId){
  const slotEl = document.querySelector(`[data-slot="${slotId}"]`);
  if(!slotEl) return;
  slotEl.innerHTML = '';
  slotEl.classList.remove('filled','correct','wrong');
}

function onDrop(e, targetSlotId){
  e.preventDefault();
  const letter = e.dataTransfer.getData('text/plain');
  if(!letter) return;
  const oldSlotId = findSlotOf(letter);
  if(oldSlotId === targetSlotId) return;

  const occupant = slotContents[targetSlotId];
  if(occupant !== undefined){
    slotContents[oldSlotId] = occupant;
    placeCardInSlot(occupant, oldSlotId);
  } else {
    slotContents[oldSlotId] = undefined;
    clearSlot(oldSlotId);
  }
  slotContents[targetSlotId] = letter;
  placeCardInSlot(letter, targetSlotId);
}

function saveAT6AndGoToNext(){
  let score = 0;

  let neededTotal = Object.keys(solution).length;

  columns.forEach((c, ci)=>{
    for(let r = 0; r < slotsPerColumn; r++){

      const slotId = 'target-' + ci + '-' + r;
      const letter = slotContents[slotId];

      if(letter === undefined) continue;

      if(solution[letter] === ci){
        score++;
      }
    }
  });

  localStorage.setItem("Lesen_AT6.3", score);

  window.location.href = "Lesen_AT7.3.html";
}

function checkAnswers(){
  clearInterval(timerInterval);
  let score = 0;
  let neededTotal = Object.keys(solution).length;

  columns.forEach((c, ci)=>{
    for(let r=0; r<slotsPerColumn; r++){
      const slotId = 'target-'+ci+'-'+r;
      const el = document.querySelector(`[data-slot="${slotId}"]`);
      el.classList.remove('correct','wrong');
      const letter = slotContents[slotId];
      if(letter === undefined) continue;
      const isCorrect = solution[letter] === ci;
      el.classList.add(isCorrect ? 'correct' : 'wrong');
      if(isCorrect) score++;
    }
  });

  const resultEl = document.getElementById('result');

  resultEl.style.color = score === neededTotal ? 'green' : 'var(--accent)';
  resultEl.textContent = `Ergebnis: ${score} von ${neededTotal} richtig zugeordnet.`;
}

function resetExercise(){
  clearInterval(timerInterval);
  timeLeft = 430;
  buildExercise();
}

function startTimer(){
  clearInterval(timerInterval);
  timeLeft = 430;
  updateTimerDisplay();
  timerInterval = setInterval(()=>{
    timeLeft--;
    updateTimerDisplay();
    if(timeLeft<=0){
      clearInterval(timerInterval);
      checkAnswers();
    }
  },1000);
}

function updateTimerDisplay(){
  const m = String(Math.floor(timeLeft/60)).padStart(2,'0');
  const s = String(timeLeft%60).padStart(2,'0');
  document.getElementById('timer').textContent = `${m}:${s}`;
}

function changeFontSize(delta){
  fontSize = Math.min(22, Math.max(11, fontSize + delta));
  document.getElementById('textpanel').style.fontSize = fontSize + 'px';
  document.querySelector("#textpanel p").style.fontSize = fontSize + "px";
}

function toggleMarking(){
  markingOn = !markingOn;
  const btn = document.getElementById('markBtn');
  btn.classList.toggle('active', markingOn);
}

function handleTextpanelMouseUp(){
  if(!markingOn) return;
  const sel = window.getSelection();
  if(!sel || sel.isCollapsed || sel.rangeCount === 0) return;
  const range = sel.getRangeAt(0);
  const tp = document.getElementById('textpanel');
  if(!tp.contains(range.commonAncestorContainer)) return;
  if(range.toString().trim() === '') { sel.removeAllRanges(); return; }
  try{
    const mark = document.createElement('mark');
    mark.className = 'hl';
    range.surroundContents(mark);
  }catch(e){}
  sel.removeAllRanges();
}

document.addEventListener('click', function(e){
  const mark = e.target.closest('mark.hl');
  if(mark){
    const parent = mark.parentNode;
    while(mark.firstChild) parent.insertBefore(mark.firstChild, mark);
    parent.removeChild(mark);
    parent.normalize();
  }
});

buildExercise();
</script>

</body>
</html>
